<!doctype html>
<html lang="en">

    <meta name="theme-color" content="#f4f4f4" />
    <title>Jaydeep Das — Portfolio</title>

    <!-- Book is the only weight above the fold; Medium/Bold load on demand. -->

      rel="preload"
      as="font"
      type="font/woff2"
      href="/fonts/ITCAvantGarde-Book.woff2"
      crossorigin
    />
    <meta name="description" content="Interaction Design Senior Analyst at Accenture. I design and build digital products & visual interfaces." />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Jaydeep Das" />
    <meta property="og:title" content="Jaydeep Das — Portfolio" />
    <meta property="og:description" content="Interaction Design Senior Analyst at Accenture. I design and build digital products & visual interfaces." />
    <meta property="og:url" content="https://itsmejaydeep.com/" />
    <meta property="og:image" content="https://itsmejaydeep.com/og-v2.png" />
    <meta property="og:image:secure_url" content="https://itsmejaydeep.com/og-v2.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1537" />
    <meta property="og:image:height" content="1023" />
    <meta property="og:image:alt" content="Jaydeep Das — Portfolio" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Jaydeep Das — Portfolio" />
    <meta name="twitter:description" content="Interaction Design Senior Analyst at Accenture. I design and build digital products & visual interfaces." />

    <link rel="canonical" href="https://itsmejaydeep.com/" />

    <!-- Microsoft Clarity. The project id is public, the same way the PostHog
         key is, so it lives here rather than in an env var. Preconnect first so
         the tag is not paying for the TLS handshake on its own. -->
    <link rel="preconnect" href="https://www.clarity.ms" crossorigin />
    <script type="text/javascript">
      (function (c, l, a, r, i, t, y) {
        c[a] =
          c[a] ||
          function () {
            (c[a].q = c[a].q || []).push(arguments);
          };
        t = l.createElement(r);
        t.async = 1;
        t.src = "https://www.clarity.ms/tag/" + i;
        y = l.getElementsByTagName(r)[0];
        y.parentNode.insertBefore(t, y);
      })(window, document, "clarity", "script", "xy8sxhnpej");
    </script>
  </head>
  <body>
    <script>
      // Resolve the theme before first paint so dark mode never flashes light.
      // Mirrors src/hooks/useTheme.js — keep the two in step.
      // Light is the default: the OS preference is deliberately not consulted, so
      // a first-time visitor on a dark-mode machine still lands on the light design.
      (function () {
        try {
          var stored = localStorage.getItem("theme");
          var dark = stored === "dark";
          document.documentElement.dataset.theme = dark ? "dark" : "light";
          document
            .querySelector('meta[name="theme-color"]')
            .setAttribute("content", dark ? "#0f0f0f" : "#f4f4f4");
        } catch (e) {
          document.documentElement.dataset.theme = "light";
        }
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
